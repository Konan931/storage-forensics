name: Read-only shell tests

on:
  pull_request:
  push:
    branches:
      - 'dwp/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Bash syntax and synthetic fixture tests
        run: bash tests/test_checkpoint.sh
